[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "x-auto"
version = "0.1.0"
description = "X monetization automation PoC (Phase 0: browser session pool + kill switch)"
requires-python = ">=3.11"
dependencies = [
  "playwright>=1.45",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "structlog>=24.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.4",
]

[project.scripts]
x-auto = "x_auto.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
